name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. 1.1.0). Defaults to the version in wp-agent.php.'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ZIP and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Build plugin ZIP
        run: bash build.sh ${{ github.event.inputs.version }}

      - name: Detect version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [[ -z "${VERSION}" ]]; then
            VERSION="$(sed -n 's/^ \* Version:[[:space:]]*\([0-9][0-9.]*\).*/\1/p' wp-agent.php | head -n1)"
          fi
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release tag: v${VERSION}"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: dist/*.zip
          generate_release_notes: true
          update_release_body: true
